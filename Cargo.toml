[package]
name = "soroban-security-scanner"
version = "1.0.0"
edition = "2021"
authors = ["connect-boiz"]
description = "Security scanner for Soroban smart contracts"
license = "MIT"
repository = "https://github.com/gbengaeben/soroban-security-scanner"
autoexamples = false

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# Authentication & Security
jsonwebtoken = "9.1"
argon2 = "0.5"
ring = "0.17"
base64 = "0.21"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"

# HTTP & Web
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br", "timeout", "limit"] }
hyper = "1.0"
mime = "0.3"

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"

# Kubernetes
k8s-openapi = { version = "0.20", features = ["v1_27"] }
kube = { version = "0.87", features = ["runtime", "derive"] }



# OAuth
oauth2 = "4.4"
url = "2.5"

# Email provider dependencies
lettre = "0.11"

# SMS provider dependencies (Twilio)
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Template engine
handlebars = "6.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# YAML support for protocol manifests
serde_yaml = "0.9"

# Transaction processing dependencies
zstd = "0.13"
regex = "1.10"
fancy-regex = "0.14"

# Configuration
config = "0.13"
toml = "0.8"
num_cpus = "1.16"
walkdir = "2.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database (for production use)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"], optional = true }

# Redis (for caching and rate limiting)
redis = { version = "0.23", features = ["tokio-comp"], optional = true }

# Rate limiting dependencies
ipnetwork = "0.20"

# AST parsing and code generation (used by scanners)
syn = { version = "2.0", features = ["full"] }
quote = "1.0"

# Additional utilities
log = "0.4"
futures = "0.3"
signal-hook = "0.3"
rand_chacha = "0.3"
http-body-util = "0.1.3"

# Protocol Analysis
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"
tempfile = "3.8"

[features]
default = []
database = ["sqlx"]
redis-cache = ["redis"]
full = ["database", "redis-cache"]

# WIP feature gates broken backend modules under active refactoring.
# Modules behind this gate have 410+ pre-existing compilation errors
# (borrow checker, missing trait impls, type mismatches) and are
# being fixed incrementally. Default compilation (no features)
# passes cleanly with a minimal stub.
broken-modules = []

[[bin]]
name = "soroban-scanner"
path = "src/main.rs"
# The CLI imports types from modules gated behind `broken-modules`
# (see the header of src/main.rs). Building it requires that feature:
#   cargo build --features broken-modules
required-features = ["broken-modules"]

[lib]
name = "soroban_security_scanner"
path = "src/lib.rs"

# The `examples/*.rs` contract fixtures (secure/vulnerable contract variants)
# are scan inputs used by the integration tests, not runnable examples, and
# they depend on soroban-sdk which is not a dependency of this crate. Disable
# auto-discovery and declare the real examples explicitly below.

[[example]]
name = "auth_server"
path = "examples/auth_server.rs"

[[example]]
name = "kubernetes_isolated_scanning"
path = "examples/kubernetes_isolated_scanning.rs"
required-features = ["broken-modules"]

# The contract integration tests (reentrancy, bounty marketplace) exercise
# modules gated behind `broken-modules` (escrow, bounty_marketplace,
# security_analyzer) that depend on soroban-sdk, which is not a dependency
# of this crate (it lives in the separate contracts/ workspace). Gate them
# behind the same feature, matching the bin and kubernetes example.

[[test]]
name = "api_versioning_tests"
path = "tests/api_versioning_tests.rs"

[[test]]
name = "audit_trail_integration_tests"
path = "tests/audit_trail_integration_tests.rs"

[[test]]
name = "auth_integration_tests"
path = "tests/auth_integration_tests.rs"

[[test]]
name = "balance_checks_test"
path = "tests/balance_checks_test.rs"

[[test]]
name = "bounty_marketplace_tests"
path = "tests/bounty_marketplace_tests.rs"
required-features = ["broken-modules"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "reentrancy_test"
path = "tests/reentrancy_test.rs"
required-features = ["broken-modules"]

[[test]]
name = "security_monitoring_baseline_api_tests"
path = "tests/security_monitoring_baseline_api_tests.rs"

[[test]]
name = "severity_scoring_integration_tests"
path = "tests/severity_scoring_integration_tests.rs"
